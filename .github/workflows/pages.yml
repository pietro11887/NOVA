# Pubblica NOVA CITY su GitHub Pages: il gioco diventa una pagina web
# normale, da aprire a schermo intero sul telefono (e da aggiungere alla
# schermata home come app).
name: Pubblica il gioco su GitHub Pages

# Serve solo se in Settings > Pages scegli "GitHub Actions" come sorgente.
# Se invece pubblichi direttamente dal branch (piu' semplice), questo
# workflow non serve: si lancia solo a mano.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Attiva Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.webmanifest src vendor _site/
          cp -r dist _site/ 2>/dev/null || true
          # niente Jekyll: le cartelle e i file passano cosi' come sono
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
